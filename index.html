    .toast {

    @media (hover:hover) and (pointer:fine) {

        background: var(--surface-2);

    .btn:active,

    :focus-visible {

      .primary-actions { grid-template-columns: 1fr 54px; }

    @media (min-width: 760px) {
      .app-shell { padding-top: 34px; }
      .profile-wrap { padding-bottom: 40px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {

        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }

    @keyframes reveal {
      to { opacity: 1; transform: none; }
    }
    @keyframes softIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes shimmer {
      to { background-position: -200% 0; }
    }
  </style>
</head>

    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7.2 3.8 9.6 7c.3.4.2 1-.2 1.3l-1.5 1.2c-.3.2-.4.6-.2.9 1.1 2.4 3 4.3 5.4 5.4.3.2.7.1.9-.2l1.2-1.5c.3-.4.9-.5 1.3-.2l3.2 2.4c.4.3.5.8.3 1.2l-.8 1.7c-.4.8-1.2 1.3-2.1 1.2C9.3 19.6 4.4 14.7 3.6 7c-.1-.9.4-1.7 1.2-2.1l1.7-.8c.3-.2.5-.2.7-.3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m5 8 7 5 7-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3c2.6 2.5 4 5.5 4 9s-1.4 6.5-4 9c-2.6-2.5-4-5.5-4-9s1.4-6.5 4-9Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 7V5.8C9 4.8 9.8 4 10.8 4h2.4C14.2 4 15 4.8 15 5.8V7M3 11.5c5.5 2.5 12.5 2.5 18 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-instagram" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="17.4" cy="6.8" r="1" fill="currentColor"/></symbol>
    <symbol id="i-linkedin" viewBox="0 0 24 24"><rect x="4" y="9" width="3.2" height="11" rx="1" fill="currentColor"/><circle cx="5.6" cy="5.3" r="1.8" fill="currentColor"/><path d="M10.2 9h3.1v1.5c.8-1.2 2-1.9 3.7-1.9 3 0 3.9 2 3.9 5v6.4h-3.3v-5.8c0-1.6-.5-2.7-2-2.7-1.7 0-2.2 1.2-2.2 3.1V20h-3.2V9Z" fill="currentColor"/></symbol>
    <symbol id="i-whatsapp" viewBox="0 0 24 24"><path d="M20 11.7a8 8 0 0 1-11.8 7L4 20l1.3-4A8 8 0 1 1 20 11.7Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.8 7.8c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.5l.8 1.9c.1.3 0 .6-.2.8l-.7.8c-.2.2-.2.4-.1.6.6 1.2 1.6 2.2 2.8 2.8.2.1.4.1.6-.1l.9-1c.2-.2.5-.3.8-.2l1.8.8c.3.1.5.3.5.6 0 .4-.2 1.2-.8 1.7-.6.5-1.4.8-2.3.6-1.4-.3-3.2-1-5-2.7-1.5-1.4-2.6-3.1-3-4.4-.3-.9-.1-1.7.2-2.3Z" fill="currentColor"/></symbol>
    <symbol id="i-facebook" viewBox="0 0 24 24"><path d="M14.2 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5H17V4c-.4-.1-1.2-.1-2.2-.1-2.2 0-3.8 1.4-3.8 3.9V10H8.5v3H11v8h3.2Z" fill="currentColor"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 4h3.7l3.7 5.2L16.7 4H19l-5.6 6.8L19.5 20h-3.7l-4.3-6-5 6H4.2l6.3-7.6L5 4Zm3.1 2L16.7 18h1.2L9.4 6H8.1Z" fill="currentColor"/></symbol>
    <symbol id="i-tiktok" viewBox="0 0 24 24"><path d="M14.2 4h3c.3 1.5 1.2 2.7 2.8 3.5v3.1c-1.2-.1-2.4-.5-3.4-1.2v5.2a5.6 5.6 0 1 1-4.9-5.6v3a2.7 2.7 0 1 0 1.8 2.6V4h.7Z" fill="currentColor"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 10.5V16M12 7.4h.01" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m6 12.5 4 4L18 8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <main class="app-shell" id="app" aria-live="polite"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    /* ============================================================
       TAPEC · PERFIL DATA
       Agrega, edita o elimina perfiles aquí. No necesitas más HTML.
       Ejemplo de URL:  ?p=jose
       ============================================================ */
    const profiles = {
      jose: {
        active: true,
        firstName: "José",
        lastName: "Ruiz",
        name: "José Ruiz",
        title: "Marketing & Comunicación",
        company: "TAPEC Studio",
        bio: "Estrategia, comunicación y experiencias digitales enfocadas en construir marcas claras, modernas y memorables.",
        photo: "",
        avatarAccent: ["#1a1a1a", "#4b4b50"],
        phone: "+593 99 123 4567",
        email: "jose@example.com",
        whatsapp: "593991234567",
        instagram: "https://instagram.com/",
        linkedin: "https://linkedin.com/",
        tiktok: "",
        facebook: "",
        x: "https://x.com/",
        website: "https://example.com/",
        portfolio: "https://example.com/portfolio"
      },
      maria: {
        active: true,
        firstName: "María",
        lastName: "Vega",
        name: "María Vega",
        title: "Product Designer",
        company: "Independent",
        bio: "Diseño productos digitales, sistemas visuales y experiencias centradas en claridad, detalle y ejecución.",
        photo: "",
        avatarAccent: ["#141414", "#55545b"],
        phone: "+593 98 765 4321",
        email: "maria@example.com",
        whatsapp: "593987654321",
        instagram: "https://instagram.com/",
        linkedin: "https://linkedin.com/",
        tiktok: "https://tiktok.com/",
        facebook: "https://facebook.com/",
        x: "",
        website: "https://example.com/",
        portfolio: "https://example.com/work"
      },
      "demo-off": {
        active: false,
        name: "Perfil demo",
        email: ""
      }
    };

    const app = document.getElementById("app");
    const toast = document.getElementById("toast");
    const skeleton = document.getElementById("skeleton");

    const icon = (name) => `<svg aria-hidden="true"><use href="#i-${name}"></use></svg>`;
    const has = (value) => typeof value === "string" && value.trim().length > 0;
    const esc = (value = "") => String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    function safeUrl(value) {
      if (!has(value)) return "";
      try {
        const url = new URL(value, window.location.href);
        return ["http:", "https:", "tel:", "mailto:"].includes(url.protocol) ? url.href : "";
      } catch { return ""; }
    }

    function makeAvatarDataUri(name, colors = ["#141414", "#4a4a4a"]) {
      const initials = name.split(/\s+/).slice(0,2).map(s => s[0] || "").join("").toUpperCase();
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="${colors[0]}"/>
              <stop offset="1" stop-color="${colors[1]}"/>
            </linearGradient>
            <radialGradient id="h" cx="50%" cy="25%" r="65%">
              <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
              <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="512" height="512" rx="120" fill="url(#g)"/>
          <rect width="512" height="512" rx="120" fill="url(#h)"/>
          <circle cx="390" cy="104" r="116" fill="#fff" opacity=".035"/>
          <circle cx="130" cy="430" r="160" fill="#000" opacity=".18"/>
          <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="700" letter-spacing="-10" fill="#fff" opacity=".94">${initials}</text>
        </svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2400);
    }

    function canonicalProfileUrl(profileId) {
      const url = new URL(window.location.href);
      url.search = "";
      url.hash = "";
      url.searchParams.set("p", profileId);
      return url.href;
    }

    function renderState(title, text) {
      app.innerHTML = `
        <section class="state-card">
          <div class="state-box">
            <div class="state-mark"><span class="wordmark-dot"></span>TAPEC</div>
            <h1>${esc(title)}</h1>
            <p>${esc(text)}</p>
          </div>
        </section>`;
      skeleton.classList.add("hide");
      setTimeout(() => skeleton.remove(), 220);
    }

    function buildLink(label, iconName, href, aria = label) {
      if (!has(href)) return "";
      return `
        <a class="link-item" href="${esc(href)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(aria)}">
          <span class="link-icon">${icon(iconName)}</span>
          <span class="link-label">${esc(label)}</span>
          <span class="link-arrow">${icon("arrow")}</span>
        </a>`;
    }

    function socialLinks(p) {
      const items = [];
      if (has(p.phone)) items.push(buildLink("Llamar", "phone", `tel:${p.phone.replace(/\s+/g, "")}`, `Llamar a ${p.name}`));
      if (has(p.email)) items.push(buildLink("Correo", "mail", `mailto:${p.email}`, `Enviar correo a ${p.name}`));
      if (has(p.whatsapp)) items.push(buildLink("WhatsApp", "whatsapp", `https://wa.me/${String(p.whatsapp).replace(/\D/g, "")}`));
      if (has(p.instagram)) items.push(buildLink("Instagram", "instagram", safeUrl(p.instagram)));
      if (has(p.linkedin)) items.push(buildLink("LinkedIn", "linkedin", safeUrl(p.linkedin)));
      if (has(p.tiktok)) items.push(buildLink("TikTok", "tiktok", safeUrl(p.tiktok)));
      if (has(p.facebook)) items.push(buildLink("Facebook", "facebook", safeUrl(p.facebook)));
      if (has(p.x)) items.push(buildLink("X", "x", safeUrl(p.x)));
      if (has(p.website)) items.push(buildLink("Página web", "globe", safeUrl(p.website)));
      if (has(p.portfolio)) items.push(buildLink("Portafolio", "briefcase", safeUrl(p.portfolio)));
      return items.filter(Boolean).join("");
    }

    function vCardEscape(value = "") {
      return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/\n/g, "\\n")
        .replace(/,/g, "\\,")
        .replace(/;/g, "\\;");
    }

    function downloadVCard(p) {
      const lines = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `N:${vCardEscape(p.lastName || "")};${vCardEscape(p.firstName || p.name || "")};;;`,
        `FN:${vCardEscape(p.name || [p.firstName, p.lastName].filter(Boolean).join(" "))}`
      ];
      if (has(p.company)) lines.push(`ORG:${vCardEscape(p.company)}`);
      if (has(p.title)) lines.push(`TITLE:${vCardEscape(p.title)}`);
      if (has(p.phone)) lines.push(`TEL;TYPE=CELL:${vCardEscape(p.phone)}`);
      if (has(p.email)) lines.push(`EMAIL;TYPE=INTERNET:${vCardEscape(p.email)}`);
      if (has(p.website)) lines.push(`URL:${vCardEscape(p.website)}`);
      lines.push("END:VCARD");

      const blob = new Blob([lines.join("\r\n")], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${(p.name || "TAPEC").replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "").toLowerCase() || "tapec"}.vcf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1200);
      showToast("Contacto listo para guardar.");
    }

    async function shareProfile(p, profileId) {
      const data = {
        title: `${p.name} · TAPEC`,
        text: `${p.name} — ${p.title || "Perfil digital"}`,
        url: canonicalProfileUrl(profileId)
      };

      try {
        if (navigator.share) {
          await navigator.share(data);
          return;
        }
      } catch (error) {
        if (error?.name === "AbortError") return;
      }

      try {
        await navigator.clipboard.writeText(data.url);
        showToast("Enlace del perfil copiado.");
      } catch {
        const temp = document.createElement("textarea");
        temp.value = data.url;
        temp.setAttribute("readonly", "");
        temp.style.position = "fixed";
        temp.style.opacity = "0";
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
        showToast("Enlace del perfil copiado.");
      }
    }

    function renderProfile(p, profileId) {
      document.title = `${p.name} · TAPEC`;
      const avatarSrc = has(p.photo) ? p.photo : makeAvatarDataUri(p.name, p.avatarAccent);
      const links = socialLinks(p);
      const showConnect = has(p.email);

      app.innerHTML = `
        <div class="profile-wrap">
          <header class="brand-row">
            <div class="wordmark" aria-label="TAPEC">
              <span class="wordmark-dot"></span>
              <span>TAPEC</span>
              <span class="brand-sub">Digital profile</span>
            </div>
            <div class="status-chip"><i></i>NFC Ready</div>
          </header>

          <section class="hero" aria-labelledby="profile-name">
            <div class="avatar-wrap">
              <img class="avatar" src="${esc(avatarSrc)}" alt="Foto de ${esc(p.name)}" width="118" height="118" decoding="async" fetchpriority="high" />
            </div>

            <div class="identity">
              <div class="eyebrow">Network Profile</div>
              <h1 class="name" id="profile-name">${esc(p.name)}</h1>
              ${has(p.title) ? `<p class="title">${esc(p.title)}</p>` : ""}
              ${has(p.company) ? `<p class="company">${esc(p.company)}</p>` : ""}
              ${has(p.bio) ? `<p class="bio">${esc(p.bio)}</p>` : ""}
            </div>

            <div class="primary-actions">
              <button class="btn btn-primary" id="saveContact" type="button">
                ${icon("plus")}<span>Guardar contacto</span>
              </button>
              <button class="btn btn-icon" id="shareProfile" type="button" aria-label="Compartir perfil">
                ${icon("share")}
              </button>
            </div>
          </section>

          ${links ? `
          <section class="section" aria-labelledby="channels-title">
            <div class="section-heading">
              <h2 class="section-title" id="channels-title">Conecta</h2>
              <span class="section-meta">Direct access</span>
            </div>
            <div class="links">${links}</div>
          </section>` : ""}

          ${showConnect ? `
          <section class="section" aria-labelledby="connect-title">
            <div class="section-heading">
              <h2 class="section-title" id="connect-title">Conectemos</h2>
              <span class="section-meta">Private handoff</span>
            </div>
            <p class="connect-copy">Déjame tus datos y escríbeme directamente.</p>

            <form id="connectForm" novalidate>
              <div class="form-grid">
                <div class="field">
                  <label for="visitorName">Nombre</label>
                  <input id="visitorName" name="visitorName" type="text" autocomplete="name" placeholder="Tu nombre completo" />
                </div>
                <div class="field">
                  <label for="visitorPhone">Número de teléfono</label>
                  <input id="visitorPhone" name="visitorPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Tu número" />
                </div>
                <button class="btn submit-btn" type="submit">
                  <span>Enviar correo</span>
                  <span class="right">Mail ${icon("arrow")}</span>
                </button>
              </div>
              <div class="inline-message" id="formMessage" role="status" aria-live="polite"></div>
            </form>
          </section>` : ""}

          <footer class="footer">
            <strong>TAPEC</strong>
            <span>Digital identity.</span>
          </footer>
        </div>`;

      document.getElementById("saveContact")?.addEventListener("click", () => downloadVCard(p));
      document.getElementById("shareProfile")?.addEventListener("click", () => shareProfile(p, profileId));

      const avatar = document.querySelector(".avatar");
      avatar?.addEventListener("error", () => {
        avatar.src = makeAvatarDataUri(p.name, p.avatarAccent);
      }, { once: true });

      const form = document.getElementById("connectForm");
      if (form) {
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const nameInput = document.getElementById("visitorName");
          const phoneInput = document.getElementById("visitorPhone");
          const message = document.getElementById("formMessage");

          const visitorName = nameInput.value.trim();
          const visitorPhone = phoneInput.value.trim();
          const phoneDigits = visitorPhone.replace(/\D/g, "");
          const invalid = !visitorName || phoneDigits.length < 7;

          nameInput.setAttribute("aria-invalid", String(!visitorName));
          phoneInput.setAttribute("aria-invalid", String(phoneDigits.length < 7));

          if (invalid) {
            message.className = "inline-message show";
            message.innerHTML = `${icon("info")}<span>Completa tu nombre y un número válido para continuar.</span>`;
            return;
          }

          message.className = "inline-message show success";
          message.innerHTML = `${icon("check")}<span>Abriendo tu aplicación de correo…</span>`;

          const subject = "Nuevo contacto desde TAPEC";
          const greetingName = p.firstName || p.name.split(/\s+/)[0] || p.name;
          const body = `Hola ${greetingName},\n\nVisité tu perfil en TAPEC y me gustaría mantenernos en contacto.\n\nMi nombre es ${visitorName}.\n\nMi número es:\n${visitorPhone}\n\nSaludos.`;
          const mailto = `mailto:${p.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

          setTimeout(() => { window.location.href = mailto; }, 120);
        });
      }

      requestAnimationFrame(() => {
        skeleton.classList.add("hide");
        setTimeout(() => skeleton.remove(), 220);
      });
    }

    (function init() {
      const params = new URLSearchParams(window.location.search);
      const profileId = (params.get("p") || "jose").trim().toLowerCase();
      const profile = profiles[profileId];

      if (!profile) {
        renderState("Perfil no encontrado", "No pudimos encontrar este perfil en TAPEC.");
        return;
      }

      if (profile.active === false) {
        renderState("Perfil no disponible", "Este perfil ha sido desactivado.");
        return;
      }

      renderProfile(profile, profileId);
    })();
  </script>
</body>
</html>
